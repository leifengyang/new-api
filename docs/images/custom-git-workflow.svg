<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1010" viewBox="0 0 1400 1010" role="img" aria-labelledby="title desc">
  <title id="title">new-api 官方更新与自定义功能的 Git 工作流</title>
  <desc id="desc">时间从左向右。custom 从官方 rc.37 提交 A 分出，功能分支提交 F1 合入为 M1。同步分支从 M1 分出并合入官方新版本 U1，形成有两个父提交的 S1；测试通过后 custom 快进至 S1 并发布 R2。之后的新功能继续从此处开发。官方历史、自定义历史都保留。</desc>
  <defs>
    <marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#426baa" stroke-width="1.5"/></marker>
    <marker id="teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#176e78" stroke-width="1.5"/></marker>
    <marker id="purple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#8260a6" stroke-width="1.5"/></marker>
    <style>
      text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;fill:#172c46}.title{font-size:32px;font-weight:700}.sub{font-size:17px;fill:#586b81}.head{font-size:20px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#586b81}.node{stroke-width:3;fill:#fff}.id{font-size:15px;font-weight:700;text-anchor:middle}.tag{font-size:16px;font-weight:700}
    </style>
  </defs>
  <rect width="1400" height="1010" rx="24" fill="#f3f6fa"/>
  <rect width="1400" height="9" fill="#426baa"/>
  <text x="48" y="64" class="title">Git 工作流：让官方历史和你的功能持续汇合</text>
  <text x="48" y="100" class="sub">从左向右看时间。圆点是提交，实线表示提交演进与合并关系；分支名只是指向提交的引用。</text>
  <rect x="48" y="130" width="1304" height="58" rx="12" fill="#172c46"/>
  <text x="72" y="166" style="font-size:18px;fill:#fff">upstream = QuantumNous/new-api（获取官方更新）　　　 origin = 你自己的仓库（保存 custom 与定制发布）</text>

  <path d="M256 224H1308" stroke="#a4b2c3" stroke-width="1.5"/>
  <path d="M1300 219L1310 224L1300 229" fill="none" stroke="#a4b2c3" stroke-width="1.5"/>
  <text x="1265" y="212" class="small">时间</text>
  <rect x="48" y="247" width="1304" height="121" rx="12" fill="#eaf0f9"/>
  <rect x="48" y="387" width="1304" height="140" rx="12" fill="#e5f2ef"/>
  <rect x="48" y="543" width="1304" height="98" rx="12" fill="#fff"/>
  <rect x="48" y="657" width="1304" height="98" rx="12" fill="#f0eaf7"/>
  <text x="70" y="286" class="head">官方历史</text>
  <text x="70" y="315" class="small">upstream</text>
  <text x="70" y="420" class="head">定制主线</text>
  <text x="70" y="449" class="small">custom</text>
  <text x="70" y="478" class="small">发布从这里取源码</text>
  <text x="70" y="581" class="head">功能分支</text>
  <text x="70" y="610" class="small">feature/...</text>
  <text x="70" y="695" class="head">升级验证分支</text>
  <text x="70" y="724" class="small">sync/...</text>

  <path d="M280 317H1305" fill="none" stroke="#426baa" stroke-width="3" marker-end="url(#blue)"/>
  <circle cx="280" cy="317" r="12" class="node" stroke="#426baa"/>
  <circle cx="575" cy="317" r="9" class="node" stroke="#426baa"/>
  <circle cx="810" cy="317" r="12" class="node" stroke="#426baa"/>
  <circle cx="1170" cy="317" r="12" class="node" stroke="#426baa"/>
  <text x="280" y="289" class="id">A · v1.0.0-rc.37</text>
  <text x="810" y="289" class="id">U1 · 选定的新官方版本</text>
  <text x="1170" y="289" class="id">U2 · 后续官方版本</text>
  <text x="449" y="348" class="small">官方继续开发，不包含你的定制功能</text>

  <path d="M280 329C280 404 316 449 370 449H680" fill="none" stroke="#176e78" stroke-width="3" marker-end="url(#teal)"/>
  <circle cx="370" cy="449" r="11" class="node" stroke="#176e78"/>
  <text x="370" y="420" class="id">C1</text>
  <text x="306" y="491" class="small">建立自己的开发历史</text>
  <path d="M382 449C413 449 421 592 500 592H545C602 592 608 449 680 449" fill="none" stroke="#176e78" stroke-width="3" marker-end="url(#teal)"/>
  <circle cx="500" cy="592" r="11" class="node" stroke="#176e78"/>
  <text x="500" y="574" class="id">F1</text>
  <text x="453" y="624" class="small">实现你的功能</text>
  <circle cx="680" cy="449" r="13" class="node" stroke="#176e78"/>
  <text x="680" y="485" class="id">M1</text>
  <rect x="572" y="392" width="214" height="35" rx="8" fill="#176e78"/>
  <text x="679" y="415" text-anchor="middle" style="font-size:16px;font-weight:700;fill:#fff">R1：rc.37 + 自定义功能</text>

  <path d="M692 449C723 449 731 706 920 706" fill="none" stroke="#8260a6" stroke-width="3" marker-end="url(#purple)"/>
  <path d="M810 329C810 510 846 644 920 706" fill="none" stroke="#426baa" stroke-width="3" marker-end="url(#blue)"/>
  <text x="847" y="561" class="small">merge U1</text>
  <circle cx="920" cy="706" r="13" class="node" stroke="#8260a6"/>
  <text x="920" y="681" class="id">S1</text>
  <text x="756" y="741" class="small">M1 + U1 → 处理冲突、测试、迁移演练</text>

  <path d="M938 692C977 642 1012 540 1050 461" fill="none" stroke="#8260a6" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#purple)"/>
  <text x="1031" y="574" class="small">测试通过后</text>
  <text x="1031" y="601" class="small">custom 快进到 S1</text>
  <circle cx="1058" cy="449" r="15" fill="#f3f6fa" stroke="#8260a6" stroke-width="2.5" stroke-dasharray="4 3"/>
  <text x="1058" y="424" class="id">S1 · 同一提交的引用</text>
  <rect x="963" y="474" width="211" height="35" rx="8" fill="#8260a6"/>
  <text x="1068" y="497" text-anchor="middle" style="font-size:16px;font-weight:700;fill:#fff">R2：U1 + 自定义功能</text>
  <path d="M1075 449H1305" fill="none" stroke="#176e78" stroke-width="3" marker-end="url(#teal)"/>
  <circle cx="1250" cy="449" r="11" class="node" stroke="#176e78"/>
  <text x="1250" y="421" class="id">C2</text>
  <text x="1201" y="536" class="small">继续开发</text>

  <rect x="48" y="785" width="406" height="142" rx="14" fill="#fff" stroke="#cbd8e3"/>
  <text x="72" y="823" class="head">为什么功能还在？</text>
  <text x="72" y="855" class="body">S1 同时继承 M1 和 U1 的历史。</text>
  <text x="72" y="884" class="body">M1 包含你的 F1，U1 带来官方更新。</text>
  <text x="72" y="909" class="small">合并时仍需正确整合两边的实际代码。</text>
  <rect x="478" y="785" width="418" height="142" rx="14" fill="#fff" stroke="#cbd8e3"/>
  <text x="502" y="823" class="head">虚线是引用移动，不是新提交</text>
  <text x="502" y="855" class="body">图中两个 S1 表示同一个合并提交。</text>
  <text x="502" y="884" class="body">custom 快进不额外创建提交。</text>
  <text x="502" y="909" class="small">若 custom 已前进，先回 sync 整合并重测。</text>
  <rect x="920" y="785" width="432" height="142" rx="14" fill="#fff1df" stroke="#dec197"/>
  <text x="944" y="823" class="head">每个发布标签对应自己的镜像</text>
  <text x="944" y="855" class="body">R1 / R2 → 固定源码 → 构建 → 镜像</text>
  <text x="944" y="884" class="body">推送 Git 不等于构建或部署 Docker。</text>
  <text x="944" y="909" class="small">发布后不移动旧标签，不覆盖共享分支历史。</text>
  <text x="48" y="972" class="small">U1、U2、R1、R2 为示意名；实际操作请使用已核实的官方标签与唯一的定制发布标签。</text>
  <text x="1352" y="972" text-anchor="end" class="small">new-api · 定制开发指南 / 02</text>
</svg>
